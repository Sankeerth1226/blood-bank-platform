<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HemoPulse Command — Live Blood Bank, Cold-Chain & 30-Min Delivery</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .leaflet-container { border-radius: 0.75rem; z-index: 10; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-red-600 flex items-center justify-center">
          <i data-lucide="droplets" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold text-white leading-tight">HemoPulse Command</h1>
          <p class="text-[11px] text-slate-400">Live Blood Inventory &bull; Cold-Chain &bull; 30-Min GPS Tracking</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-semibold">
          Live GPS Telemetry Active
        </span>
        <button id="btn-toggle-gps" type="button" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">
          Pause GPS
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 py-5 space-y-5 flex-1">
    <!-- Live Tracking Map & Telemetry Strip -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold text-white">Live 30-Minute Emergency Courier Map (Hyderabad Grid)</h2>
          <p class="text-xs text-slate-400">Route: NIMS Blood Bank (Punjagutta) &rarr; Apollo Hospitals (Jubilee Hills)</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5">
            <span class="text-[10px] text-slate-400 block">Live ETA</span>
            <strong id="live-eta" class="text-indigo-400 font-mono">14m 20s</strong>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5">
            <span class="text-[10px] text-slate-400 block">Cold-Box</span>
            <strong id="live-temp" class="text-emerald-400 font-mono">3.8°C</strong>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5">
            <span class="text-[10px] text-slate-400 block">GPS Coords</span>
            <strong id="live-coords" class="text-sky-400 font-mono">17.4205, 78.4540</strong>
          </div>
        </div>
      </div>
      <div id="delivery-map" style="height: 360px;" class="w-full"></div>
    </section>

    <!-- Blood Stock Summary -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stock-cards"></section>
  </main>

  <script>
    const stock = [
      { group: 'O-', units: 6, temp: '3.9°C', alert: true },
      { group: 'O+', units: 35, temp: '4.1°C', alert: false },
      { group: 'A+', units: 19, temp: '4.0°C', alert: false },
      { group: 'B+', units: 37, temp: '3.8°C', alert: false }
    ];
    document.getElementById('stock-cards').innerHTML = stock.map(s => `
      <div class="bg-slate-900 border ${s.alert ? 'border-red-500/60' : 'border-slate-800'} rounded-xl p-4">
        <div class="flex items-center justify-between">
          <span class="text-lg font-black text-white">${s.group}</span>
          <span class="text-[10px] px-2 py-0.5 rounded font-bold ${s.alert ? 'bg-red-600 text-white' : 'bg-emerald-950 text-emerald-300'}">${s.alert ? 'LOW STOCK' : 'AVAILABLE'}</span>
        </div>
        <div class="text-2xl font-extrabold text-white mt-2">${s.units} <span class="text-xs font-normal text-slate-400">units</span></div>
        <div class="text-[11px] text-slate-400 mt-1">Vault Temp: <strong class="text-emerald-400">${s.temp}</strong></div>
      </div>
    `).join('');

    const route = [
      [17.4205, 78.4540],
      [17.4220, 78.4495],
      [17.4202, 78.4450],
      [17.4184, 78.4418],
      [17.4165, 78.4382]
    ];
    const map = L.map('delivery-map').setView(route[0], 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 18
    }).addTo(map);
    L.polyline(route, { color: '#6366f1', weight: 4, dashArray: '8, 6' }).addTo(map);
    const courierMarker = L.circleMarker(route[0], {
      radius: 9, fillColor: '#10b981', color: '#ffffff', weight: 3, fillOpacity: 1
    }).addTo(map).bindPopup('Courier #HYD-09 (Cold-Box Active)');

    let running = true;
    let progress = 0.05;
    document.getElementById('btn-toggle-gps').addEventListener('click', (e) => {
      running = !running;
      e.target.textContent = running ? 'Pause GPS' : 'Resume GPS';
    });

    setInterval(() => {
      if (!running) return;
      progress += 0.03;
      if (progress > 1) progress = 0.05;
      const scaled = progress * (route.length - 1);
      const idx = Math.min(route.length - 2, Math.floor(scaled));
      const frac = scaled - idx;
      const lat = route[idx][0] + (route[idx + 1][0] - route[idx][0]) * frac;
      const lng = route[idx][1] + (route[idx + 1][1] - route[idx][1]) * frac;
      courierMarker.setLatLng([lat, lng]);
      const mins = Math.max(1, Math.round((1 - progress) * 18));
      const secs = Math.floor(Math.random() * 59).toString().padStart(2, '0');
      const temp = (3.7 + (Math.random() - 0.5) * 0.2).toFixed(1);
      document.getElementById('live-eta').textContent = `${mins}m ${secs}s`;
      document.getElementById('live-temp').textContent = `${temp}°C`;
      document.getElementById('live-coords').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }, 1500);

    lucide.createIcons();
  </script>
</body>
</html>
